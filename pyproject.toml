[project]
name = "bereikbaarheid-natuurbegraafplaatsen"
version = "0.1.0"
description = "Reproduceerbare analyse van de autorijtijd vanaf vermoedelijke woonadressen in Vlaanderen naar natuurbegraafplaatsen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "geopandas>=1.0.0",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pyproj>=3.6.0",
    "rasterio>=1.4.0",
    "shapely>=2.0.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
bereikbaarheid = "bereikbaarheid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bereikbaarheid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
